<svg width="400" height="240" viewBox="0 0 400 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="reportBg" x1="0" y1="0" x2="400" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#12111E"/>
      <stop offset="100%" stop-color="#09080E"/>
    </linearGradient>
    <linearGradient id="chartGrad" x1="0" y1="0" x2="0" y2="100%">
      <stop offset="0%" stop-color="#7C61FF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#7C61FF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="400" height="240" rx="16" fill="url(#reportBg)" stroke="#7C61FF" stroke-opacity="0.2"/>

  <!-- Top Pill -->
  <rect x="24" y="24" width="120" height="24" rx="6" fill="#8B5CF6" fill-opacity="0.15" stroke="#8B5CF6" stroke-opacity="0.3"/>
  <text x="34" y="40" fill="#A78BFA" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="11">SINGLE COCKPIT</text>

  <!-- Metric Overview with comfortable gap -->
  <text x="24" y="85" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="28" letter-spacing="-0.5">$184.2K</text>

  <rect x="175" y="66" width="155" height="24" rx="12" fill="#10B981" fill-opacity="0.12" stroke="#10B981" stroke-opacity="0.3" stroke-width="1"/>
  <text x="252" y="82" text-anchor="middle" fill="#34D399" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="11" letter-spacing="0.2">▲ +48.6% Monthly</text>

  <!-- Area Chart fill -->
  <path d="M 24 190 L 60 170 L 110 175 L 160 145 L 210 150 L 260 120 L 310 125 L 376 95 L 376 210 L 24 210 Z" fill="url(#chartGrad)"/>
  
  <!-- Line Stroke -->
  <path d="M 24 190 L 60 170 L 110 175 L 160 145 L 210 150 L 260 120 L 310 125 L 376 95" stroke="#7C61FF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Peak point highlight -->
  <circle cx="376" cy="95" r="5" fill="#A78BFA" stroke="#FFFFFF" stroke-width="2"/>

  <!-- Chart Axis line -->
  <line x1="24" y1="210" x2="376" y2="210" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1"/>
  
  <!-- Mini KPI Badges below -->
  <g transform="translate(24, 218)">
    <text x="0" y="10" fill="#6B7280" font-family="system-ui, -apple-system, sans-serif" font-size="10">W1</text>
    <text x="80" y="10" fill="#6B7280" font-family="system-ui, -apple-system, sans-serif" font-size="10">W2</text>
    <text x="170" y="10" fill="#6B7280" font-family="system-ui, -apple-system, sans-serif" font-size="10">W3</text>
    <text x="260" y="10" fill="#6B7280" font-family="system-ui, -apple-system, sans-serif" font-size="10">W4</text>
    <text x="340" y="10" fill="#A78BFA" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700">NOW</text>
  </g>
</svg>
