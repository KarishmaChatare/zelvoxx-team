<svg width="400" height="240" viewBox="0 0 400 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="compBg" x1="0" y1="0" x2="400" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#12111E"/>
      <stop offset="100%" stop-color="#09080E"/>
    </linearGradient>
    <linearGradient id="barGrad1" x1="0" y1="0" x2="0" y2="100%">
      <stop offset="0%" stop-color="#7C61FF"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="barGrad2" x1="0" y1="0" x2="0" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>
    <linearGradient id="barGrad3" x1="0" y1="0" x2="0" y2="100%">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#7C61FF"/>
    </linearGradient>
  </defs>

  <rect width="400" height="240" rx="16" fill="url(#compBg)" stroke="#7C61FF" stroke-opacity="0.2"/>

  <!-- Top Pill: COMPOUNDING ROI -->
  <rect x="24" y="24" width="128" height="24" rx="6" fill="#A78BFA" fill-opacity="0.15" stroke="#A78BFA" stroke-opacity="0.3"/>
  <text x="34" y="40" fill="#A78BFA" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="11">COMPOUNDING ROI</text>

  <!-- Metric Area: 8.4x Multiplier (ends at x ≈ 172) -->
  <text x="24" y="82" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="22" letter-spacing="-0.5">8.4x Multiplier</text>

  <!-- Decreasing CAC Badge (starts at x = 195, clear 23px gap from Multiplier, zero overlap) -->
  <rect x="195" y="64" width="138" height="24" rx="12" fill="#10B981" fill-opacity="0.12" stroke="#10B981" stroke-opacity="0.3" stroke-width="1"/>
  <text x="264" y="80" text-anchor="middle" fill="#34D399" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="11">📉 Decreasing CAC</text>

  <!-- Ground baseline -->
  <line x1="24" y1="200" x2="376" y2="200" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1"/>

  <!-- Compounding Bars (all tops stay below y = 100, providing complete vertical clearance under metric row) -->
  <!-- Bar 1 -->
  <rect x="26" y="176" width="28" height="24" rx="5" fill="#2E2A4A"/>
  <text x="40" y="216" text-anchor="middle" fill="#6B7280" font-family="system-ui, -apple-system, sans-serif" font-size="10">M1</text>

  <!-- Bar 2 -->
  <rect x="64" y="160" width="28" height="40" rx="5" fill="#3D3568"/>
  <text x="78" y="216" text-anchor="middle" fill="#6B7280" font-family="system-ui, -apple-system, sans-serif" font-size="10">M2</text>

  <!-- Bar 3 -->
  <rect x="102" y="142" width="28" height="58" rx="5" fill="url(#barGrad1)"/>
  <text x="116" y="216" text-anchor="middle" fill="#9CA3AF" font-family="system-ui, -apple-system, sans-serif" font-size="10">M3</text>

  <!-- Bar 4 -->
  <rect x="140" y="122" width="28" height="78" rx="5" fill="url(#barGrad2)"/>
  <text x="154" y="216" text-anchor="middle" fill="#9CA3AF" font-family="system-ui, -apple-system, sans-serif" font-size="10">M4</text>

  <!-- Bar 5 - Compounded (tops out at y = 102, completely beneath metric row) -->
  <rect x="178" y="102" width="32" height="98" rx="5" fill="url(#barGrad3)"/>
  <text x="194" y="216" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="10">M6</text>

  <!-- Dotted Exponential Trend Line (curves cleanly below metric text) -->
  <path d="M 40 174 Q 116 138 194 100" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="3 3"/>
  <circle cx="194" cy="100" r="3.5" fill="#FFFFFF"/>

  <!-- Badge in open right-hand area (zero overlap with bars, curve, or Decreasing CAC) -->
  <rect x="238" y="112" width="138" height="46" rx="10" fill="#181728" stroke="#A78BFA" stroke-opacity="0.4" stroke-width="1"/>
  <text x="307" y="131" text-anchor="middle" fill="#A78BFA" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="13">+340%</text>
  <text x="307" y="147" text-anchor="middle" fill="#9CA3AF" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="10">Conversion Lift</text>
</svg>
