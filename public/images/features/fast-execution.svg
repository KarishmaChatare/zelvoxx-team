<svg width="400" height="240" viewBox="0 0 400 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="400" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#12111E"/>
      <stop offset="100%" stop-color="#09080E"/>
    </linearGradient>
    <linearGradient id="purpleGlowLine" x1="0" y1="0" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C61FF"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
  </defs>

  <rect width="400" height="240" rx="16" fill="url(#cardBg)" stroke="#7C61FF" stroke-opacity="0.2"/>
  
  <!-- Subtle Grid -->
  <g opacity="0.05" stroke="#FFFFFF">
    <line x1="20" y1="40" x2="380" y2="40"/>
    <line x1="20" y1="100" x2="380" y2="100"/>
    <line x1="20" y1="160" x2="380" y2="160"/>
    <line x1="20" y1="220" x2="380" y2="220"/>
  </g>

  <!-- Header pill: RAPID SPRINT -->
  <rect x="24" y="24" width="112" height="24" rx="6" fill="#7C61FF" fill-opacity="0.15" stroke="#7C61FF" stroke-opacity="0.3"/>
  <text x="34" y="40" fill="#A78BFA" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="11">RAPID SPRINT</text>

  <!-- Metric: 7-14 Days (ends at x ≈ 142) -->
  <text x="24" y="82" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="24" letter-spacing="-0.5">7-14 Days</text>
  
  <!-- Production Ready Badge (starts at x = 175, clear 33px gap from 7-14 Days, zero overlap) -->
  <rect x="175" y="64" width="144" height="24" rx="12" fill="#10B981" fill-opacity="0.12" stroke="#10B981" stroke-opacity="0.3" stroke-width="1"/>
  <circle cx="189" cy="76" r="3.5" fill="#34D399"/>
  <text x="199" y="80" fill="#34D399" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="11" letter-spacing="0.2">Production Ready</text>

  <!-- Timeline Step Progress Bar -->
  <rect x="24" y="115" width="352" height="6" rx="3" fill="#1F1D30"/>
  <rect x="24" y="115" width="280" height="6" rx="3" fill="url(#purpleGlowLine)"/>

  <!-- Milestone Nodes -->
  <!-- Node 1: Wireframe -->
  <circle cx="50" cy="155" r="14" fill="#1A1829" stroke="#7C61FF" stroke-width="2"/>
  <text x="50" y="159" text-anchor="middle" fill="#A78BFA" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="10">01</text>
  <text x="50" y="185" text-anchor="middle" fill="#9CA3AF" font-family="system-ui, -apple-system, sans-serif" font-size="10">Wireframe</text>

  <!-- Connector -->
  <line x1="70" y1="155" x2="130" y2="155" stroke="#7C61FF" stroke-opacity="0.4" stroke-width="2" stroke-dasharray="2 2"/>

  <!-- Node 2: Engineered -->
  <circle cx="150" cy="155" r="14" fill="#1A1829" stroke="#7C61FF" stroke-width="2"/>
  <text x="150" y="159" text-anchor="middle" fill="#A78BFA" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="10">02</text>
  <text x="150" y="185" text-anchor="middle" fill="#9CA3AF" font-family="system-ui, -apple-system, sans-serif" font-size="10">Engineered</text>

  <!-- Connector -->
  <line x1="170" y1="155" x2="230" y2="155" stroke="#7C61FF" stroke-opacity="0.4" stroke-width="2" stroke-dasharray="2 2"/>

  <!-- Node 3: Deployed -->
  <circle cx="250" cy="155" r="16" fill="#7C61FF" fill-opacity="0.25" stroke="#A78BFA" stroke-width="2"/>
  <path d="M245 155L249 159L256 151" stroke="#34D399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="250" y="185" text-anchor="middle" fill="#34D399" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="10">Deployed</text>

  <!-- Floating Velocity Tag -->
  <rect x="290" y="140" width="86" height="30" rx="8" fill="#181628" stroke="#34D399" stroke-opacity="0.4"/>
  <text x="333" y="159" text-anchor="middle" fill="#34D399" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="11">⚡ 3x Speed</text>
</svg>
